
name: Daily ECMWF Links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
      timezone: "Europe/Rome"

jobs:
  send-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate ECMWF links
        run: python download_maps_playwright_debug.py

      - name: Prepare email data
        id: email
        shell: bash
        run: |
          echo "date=$(TZ=Europe/Rome date +'%d-%m-%Y')" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            cat ecmwf_links.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          secure: true
          to: luca.molini@cimfaoundation.org
          from: ${{ secrets.SMTP_FROM }}
          subject: "ECMWF EFI TP links - ${{ steps.email.outputs.date }}"
          body: ${{ steps.email.outputs.body }}
